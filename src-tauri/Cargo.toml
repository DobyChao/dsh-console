[package]
name = "dsh-console"
version = "0.1.0"
description = "Desktop console and plugin manager for DeepSeek Harness"
authors = ["dsh-console"]
edition = "2021"

[lib]
name = "dsh_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
dunce = "1"
kill_tree = "0.2"
process-wrap = { version = "9.1", default-features = false, features = [
    "std",
    "job-object",
    "creation-flags",
    "process-group",
] }
reqwest = { version = "0.12", default-features = true, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
